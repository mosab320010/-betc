version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eduverse
      POSTGRES_PASSWORD: eduverse
      POSTGRES_DB: eduverse
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  backend:
    build: ./backend
    environment:
      PORT: '4000'
      CORS_ORIGINS: 'http://localhost:5173'
      JWT_SECRET: 'replace-me'
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - mongo
      - redis

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: 'http://localhost:3000/api/v1'
    ports:
      - '5173:5173'
    depends_on:
      - gateway

  gateway:
    build: ./gateway
    environment:
      BACKEND_URL: 'http://backend:4000'
    ports:
      - '3000:3000'
    depends_on:
      - backend

  nginx:
    image: nginx:1.27
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - frontend
      - gateway

volumes:
  postgres_data:
  mongo_data:
